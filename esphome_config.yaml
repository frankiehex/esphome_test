esphome:
  name: ws2812-led-effects
  platform: ESP32
  board: esp32dev
  min_version: 2024.1.0
  on_boot:
    priority: 600
    then:
      - logger.log:
          format: "WS2812 LED Effects v1.0.0 started - System ready"
          level: INFO

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: light
  ap:
    ssid: "ws2812-fallback"
    password: !secret ap_password

# Enable logging
logger:
  level: INFO
  logs:
    component: DEBUG

# Enable Home Assistant integration
api:
  encryption:
    key: !secret api_key

# Over-the-Air Updates
ota:
  password: !secret ota_password

# Web Server for control interface
web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

# NeoPixel strip configuration for WS2812 LED
# GPIO4 is used for data line (directly driven by neopixel platform)
light:
  - platform: neopixel
    pin: GPIO4
    num_leds: 30
    rgb_order: GRB
    name: "WS2812 LED Strip"
    id: ws2812_light
    default_transition_length: 500ms
    color_correct: [50%, 50%, 50%]
    effects:
      - pulse:
          name: "Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - random:
          name: "Random"
          transition_length: 5s
          update_interval: 10s
      - strobe:
          name: "Strobe"
          colors:
            - red: 100%
              green: 0%
              blue: 0%
            - red: 0%
              green: 100%
              blue: 0%
            - red: 0%
              green: 0%
              blue: 100%
            - red: 100%
              green: 100%
              blue: 0%
          state_transition_length: 300ms
          strobe_length: 300ms
      - rainbow:
          name: "Rainbow"
          speed: 10
          transition_length: 10ms
          update_interval: 10ms
      - scan:
          name: "Scan"
          speed: 10
          transition_length: 100ms
          movement_length: 55%
      - twinkle:
          name: "Twinkle"
          speed: 8
          transition_length: 45ms
          progress_interval: 4ms
      - fireworks:
          name: "Fireworks"
          update_interval: 32ms

# GPIO Configuration Notes
# GPIO4  - WS2812 Data (default) - Recommended for stability
# GPIO23 - Alternative pin (with level shifter recommended)
# GPIO5  - Alternative pin (with level shifter recommended)
# GPIO25 - Alternative pin (PWM capable, with level shifter recommended)
# Note: Use 3.3V to 5V level shifter for reliable communication

packages:
  version: !include version.yaml
