<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WS2812 LED 效果控制</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            overflow-y: auto;
            max-height: 90vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .version-info {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 12px 15px;
            border-radius: 5px;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        .version-info div {
            margin: 5px 0;
        }

        .version-label {
            font-weight: 600;
            color: #333;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .control-label label {
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }

        .control-value {
            font-size: 13px;
            color: #667eea;
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(102, 126, 234, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(102, 126, 234, 0.3);
        }

        .color-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            font-weight: bold;
        }

        .color-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .color-btn.active {
            border: 3px solid #333;
        }

        .red { background: #FF4444; }
        .green { background: #44FF44; }
        .blue { background: #4444FF; }
        .white { background: #FFFFFF; border: 1px solid #ccc; color: #333; }
        .purple { background: #FF44FF; }
        .cyan { background: #44FFFF; color: #333; }
        .yellow { background: #FFFF44; color: #333; }
        .orange { background: #FF8800; }

        .effect-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .effect-btn {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .effect-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .effect-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .power-control {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .toggle-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .toggle-btn.on {
            background: #44a854;
            color: white;
            border-color: #44a854;
        }

        .toggle-btn.off {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .status {
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
            text-align: center;
            margin-top: 20px;
        }

        .status.connected {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .status.disconnected {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 0.8s linear infinite;
            margin-right: 5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .input-item input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }

        .input-item label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #666;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            .effect-buttons {
                grid-template-columns: 1fr;
            }

            .power-control {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💡 WS2812 LED 效果</h1>
            <div class="version-info">
                <div><span class="version-label">版本號:</span> <span id="version">v1.0.0</span></div>
                <div><span class="version-label">建置日期:</span> <span id="build-date">2026-03-08</span></div>
                <div><span class="version-label">設備:</span> <span id="device-name">WS2812 LED Controller</span></div>
            </div>
        </div>

        <!-- Power Control Section -->
        <div class="section">
            <div class="section-title">電源控制</div>
            <div class="power-control">
                <button class="toggle-btn on" id="power-on">開啟</button>
                <button class="toggle-btn off" id="power-off">關閉</button>
            </div>
        </div>

        <!-- LED Effects Section -->
        <div class="section">
            <div class="section-title">LED 效果</div>
            <div class="effect-buttons">
                <button class="effect-btn active" data-effect="pulse">Pulse</button>
                <button class="effect-btn" data-effect="rainbow">Rainbow</button>
                <button class="effect-btn" data-effect="strobe">Strobe</button>
                <button class="effect-btn" data-effect="scan">Scan</button>
                <button class="effect-btn" data-effect="twinkle">Twinkle</button>
                <button class="effect-btn" data-effect="random">Random</button>
            </div>
        </div>

        <!-- Color Selection -->
        <div class="section">
            <div class="section-title">顏色選擇</div>
            <div class="color-picker">
                <button class="color-btn red active" data-color="red" title="紅色">🔴</button>
                <button class="color-btn green" data-color="green" title="綠色">🟢</button>
                <button class="color-btn blue" data-color="blue" title="藍色">🔵</button>
                <button class="color-btn white" data-color="white" title="白色">⚪</button>
                <button class="color-btn purple" data-color="purple" title="紫色">🟣</button>
                <button class="color-btn cyan" data-color="cyan" title="青色">🟦</button>
                <button class="color-btn yellow" data-color="yellow" title="黃色">🟨</button>
                <button class="color-btn orange" data-color="orange" title="橙色">🟠</button>
            </div>
        </div>

        <!-- Brightness Control -->
        <div class="section">
            <div class="control-group">
                <div class="control-label">
                    <label for="brightness">亮度</label>
                    <span class="control-value" id="brightness-value">100%</span>
                </div>
                <input type="range" id="brightness" min="0" max="100" value="100">
            </div>
        </div>

        <!-- Speed Control -->
        <div class="section">
            <div class="control-group">
                <div class="control-label">
                    <label for="speed">效果速度</label>
                    <span class="control-value" id="speed-value">50%</span>
                </div>
                <input type="range" id="speed" min="0" max="100" value="50">
            </div>
        </div>

        <!-- LED Count Configuration -->
        <div class="section">
            <div class="section-title">LED 配置</div>
            <div class="input-group">
                <div class="input-item">
                    <label for="led-count">LED 數量</label>
                    <input type="number" id="led-count" min="1" max="1000" value="30">
                </div>
                <div class="input-item">
                    <label for="led-pin">GPIO 腳位</label>
                    <input type="number" id="led-pin" min="0" max="39" value="4">
                </div>
            </div>
        </div>

        <!-- Status -->
        <div class="status connected">
            <span class="spinner"></span>
            <span id="status-text">已連接</span>
        </div>
    </div>

    <script>
        // API communication
        const API_BASE = '/api';
        let currentState = {
            power: true,
            effect: 'pulse',
            color: 'red',
            brightness: 100,
            speed: 50,
            ledCount: 30,
            ledPin: 4
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeUI();
            loadVersionInfo();
            updateStatus('connected');
        });

        function initializeUI() {
            // Power buttons
            document.getElementById('power-on').addEventListener('click', () => setPower(true));
            document.getElementById('power-off').addEventListener('click', () => setPower(false));

            // Effect buttons
            document.querySelectorAll('[data-effect]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('[data-effect]').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    setEffect(e.target.dataset.effect);
                });
            });

            // Color buttons
            document.querySelectorAll('[data-color]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('[data-color]').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    setColor(e.target.dataset.color);
                });
            });

            // Brightness control
            document.getElementById('brightness').addEventListener('input', (e) => {
                const value = e.target.value;
                document.getElementById('brightness-value').textContent = value + '%';
                setBrightness(value);
            });

            // Speed control
            document.getElementById('speed').addEventListener('input', (e) => {
                const value = e.target.value;
                document.getElementById('speed-value').textContent = value + '%';
                setSpeed(value);
            });

            // LED configuration
            document.getElementById('led-count').addEventListener('change', (e) => {
                setLedCount(e.target.value);
            });

            document.getElementById('led-pin').addEventListener('change', (e) => {
                setLedPin(e.target.value);
            });
        }

        function loadVersionInfo() {
            // Load version from API or set defaults
            document.getElementById('version').textContent = 'v1.0.0';
            document.getElementById('build-date').textContent = '2026-03-08';
            document.getElementById('device-name').textContent = 'WS2812 LED Controller';
        }

        // API Commands
        async function sendCommand(command, data = {}) {
            try {
                const response = await fetch(`${API_BASE}/command`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ command, ...data })
                });

                if (response.ok) {
                    updateStatus('connected');
                    return await response.json();
                } else {
                    updateStatus('disconnected');
                }
            } catch (error) {
                console.error('API Error:', error);
                updateStatus('disconnected');
            }
        }

        function setPower(state) {
            currentState.power = state;
            document.getElementById('power-on').classList.toggle('on', state);
            document.getElementById('power-off').classList.toggle('off', !state);
            sendCommand('power', { state });
        }

        function setEffect(effect) {
            currentState.effect = effect;
            sendCommand('effect', { effect });
        }

        function setColor(color) {
            currentState.color = color;
            sendCommand('color', { color });
        }

        function setBrightness(value) {
            currentState.brightness = value;
            sendCommand('brightness', { brightness: value });
        }

        function setSpeed(value) {
            currentState.speed = value;
            sendCommand('speed', { speed: value });
        }

        function setLedCount(count) {
            currentState.ledCount = count;
            sendCommand('config', { ledCount: count });
        }

        function setLedPin(pin) {
            currentState.ledPin = pin;
            sendCommand('config', { ledPin: pin });
        }

        function updateStatus(status) {
            const statusEl = document.querySelector('.status');
            const statusText = document.getElementById('status-text');

            if (status === 'connected') {
                statusEl.classList.remove('disconnected');
                statusEl.classList.add('connected');
                statusText.textContent = '已連接';
            } else {
                statusEl.classList.remove('connected');
                statusEl.classList.add('disconnected');
                statusText.textContent = '未連接';
            }
        }

        // Auto-connect check every 5 seconds
        setInterval(() => {
            fetch(`${API_BASE}/status`)
                .then(r => r.ok ? updateStatus('connected') : updateStatus('disconnected'))
                .catch(() => updateStatus('disconnected'));
        }, 5000);
    </script>
</body>
</html>
